# LoRA Fine-Tuning Configuration for GeoAI Hackathon 2026
# Base Model: Qwen/Qwen2.5-1.5B-Instruct (<3B parameters, Apache 2.0)

model:
  base_model_name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"
  torch_dtype: "float32"  # "float32" for CPU training; use "bfloat16" on CUDA/Colab GPU
  trust_remote_code: false

lora:
  r: 8
  lora_alpha: 16
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./huggingface_model"
  train_data_path: "./datasets/train_recommendations.jsonl"
  eval_data_path: "./datasets/eval_recommendations.jsonl"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 2
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 1
  seed: 42
  max_seq_length: 1024
  dataloader_num_workers: 0

hardware:
  local_device: "cpu"  # Intel Core i7-1265U
  recommended_cloud_runtime: "Free Google Colab T4 GPU or Kaggle P100/T4"
